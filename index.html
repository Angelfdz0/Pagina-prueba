<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Estudio creativo especializado en diseño digital, branding y desarrollo web de alto impacto en México.">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="index, follow">
    <meta name="format-detection" content="telephone=yes">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Studio | Estudio Creativo">
    <meta property="og:description" content="Diseño, estrategia y tecnología fusionados para construir marcas que trascienden lo ordinario.">
    <meta property="og:locale" content="es_MX">

    <title>Studio | Estudio Creativo</title>

    <!-- Favicon SVG inline -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='55' font-weight='bold' fill='%23c9a96e' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

    <!-- Configuración global (bloqueante, debe ir primero) -->
    <script src="config.js"></script>
    <script src="theme.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="light.css">

    <!-- Font Awesome (carga diferida, no bloquea el primer pintado) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>

    <!-- Supabase CDN (diferido, solo se usa para login discreto del footer) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>

<body>

    <!-- Cursor personalizado -->
    <div class="cursor" id="cursor" aria-hidden="true"></div>
    <div class="cursor-follower" id="cursorFollower" aria-hidden="true"></div>

    <!-- Grain overlay -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Loader (app.js pinta el nombre desde config.js) -->
    <div class="loader" id="loader" role="status" aria-label="Cargando página" aria-live="polite">
        <div class="loader-inner">
            <div class="loader-title-wrapper">
                <span class="loader-title-base"></span>
                <span class="loader-title-fill" id="loaderTitleFill"></span>
            </div>
            <div class="loader-percentage" id="loaderPercentage">0%</div>
        </div>
    </div>

    <!-- Header / Navegación -->
    <header class="header" id="header" role="banner">
        <nav class="nav" id="nav" role="navigation" aria-label="Navegación principal"></nav>
    </header>

    <main role="main">

        <!-- Hero -->
        <section class="hero" id="hero" aria-label="Inicio">
            <div class="hero-bg" id="heroBg" aria-hidden="true"></div>
            <div class="hero-glow" aria-hidden="true"></div>
            <div class="hero-content" id="heroContent"></div>

            <div class="scroll-indicator" id="scrollIndicator" aria-hidden="true">
                <div class="scroll-indicator-line"></div>
                <span class="scroll-indicator-text">Scroll</span>
            </div>

            <div class="hero-wave" aria-hidden="true">
                <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                    <path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="var(--color-bg)"/>
                </svg>
            </div>
        </section>

        <!-- Bloque 1: Historia -->
        <section class="section section-story" id="story">
            <div class="section-inner" id="storyInner"></div>
        </section>

        <!-- Bloque 2: Equipo Médico -->
        <section class="section section-team" id="team">
            <div class="section-inner" id="teamInner"></div>
        </section>

        <!-- Bloque 3: Servicios -->
        <section class="section section-services" id="services">
            <div class="section-inner" id="servicesInner"></div>
        </section>

        <!-- Bloque 4: Menu -->
        <section class="section section-menu" id="menu">
            <div class="section-inner" id="menuInner"></div>
        </section>

        <!-- Bloque 5: Antes/Despues -->
        <section class="section section-beforeafter" id="beforeafter">
            <div class="section-inner" id="beforeafterInner"></div>
        </section>

        <!-- Bloque 6: Galería / Portafolio -->
        <section class="section section-gallery" id="gallery">
            <div class="section-inner" id="galleryInner"></div>
        </section>

        <!-- Bloque 7: Filosofía -->
        <section class="section section-philosophy" id="philosophy">
            <div class="section-inner" id="philosophyInner"></div>
        </section>

        <!-- Bloque 8: E-commerce -->
        <section class="section section-ecommerce" id="ecommerce">
            <div class="section-inner" id="ecommerceInner"></div>
        </section>

        <!-- 🤝 Bloque 9: COLABORA CON NOSOTROS (B2B) -->
        <section class="section section-collab" id="collab">
            <div class="section-inner" id="collabInner"></div>
        </section>

        <!-- 🎂 Bloque 10: COTIZADOR DE PASTELES -->
        <section class="section section-cotizador" id="cotizador">
            <div class="section-inner" id="cotizadorInner"></div>
        </section>

        <!-- 🍓 Bloque 11: TEMPORADA -->
        <section class="section section-season" id="season">
            <div class="section-inner" id="seasonInner"></div>
        </section>

        <!-- Bloque 12: Blog -->
        <section class="section section-blog" id="blog">
            <div class="section-inner" id="blogInner"></div>
        </section>

        <!-- Bloque 13: Ubicación -->
        <section class="section section-location" id="location">
            <div class="section-inner" id="locationInner"></div>
        </section>

        <!-- Bloque 14: Citas -->
        <section class="section section-appointments" id="appointments">
            <div class="section-inner" id="appointmentsInner"></div>
        </section>

        <!-- Bloque 15: Planes -->
        <section class="section section-plans" id="plans">
            <div class="section-inner" id="plansInner"></div>
        </section>

        <!-- Bloque 16: Planes -->
        <section class="section section-classes" id="classes">
            <div class="section-inner" id="classesInner"></div>
        </section>

        <!-- Bloque 17: Contacto -->
        <section class="section section-contact" id="contact">
            <div class="section-inner" id="contactInner"></div>
        </section>

        <!-- Bloque 18: Testimonios -->
        <section class="section section-testimonials" id="testimonials">
            <div class="section-inner" id="testimonialsInner"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer" id="footer" role="contentinfo">
        <div class="footer-inner" id="footerInner"></div>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script src="admin-auth.js"></script>
    <script src="cookie-consent.js" defer></script>

</body>
</html>
