<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CURSOR PERSONALIZADO -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <!-- OVERLAY DE RUIDO (grain editorial) -->
  <div class="grain-overlay"></div>

  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-inner">
      <span class="loader-text" id="loaderText"></span>
      <div class="loader-bar"><div class="loader-bar-fill" id="loaderBar"></div></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <nav class="nav" id="nav"></nav>
  </header>

  <!-- INTRO / HERO -->
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <canvas class="hero-particles" id="heroParticles"></canvas>
    <div class="hero-content" id="heroContent"></div>
    <div class="scroll-indicator" id="scrollIndicator">
      <span class="scroll-indicator-line"></span>
      <span class="scroll-indicator-text">Scroll</span>
    </div>
    <!-- OLA DECORATIVA -->
<div class="hero-wave" id="heroWave">
  <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,64C240,140 480,20 720,60C960,100 1200,140 1440,80V120H0V64Z" fill="var(--color-bg)"/>
    <path d="M0,64C240,140 480,20 720,60C960,100 1200,140 1440,80V120H0V64Z" fill="var(--color-bg)" opacity="0.5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,64C240,140 480,20 720,60C960,100 1200,140 1440,80V120H0V64Z;
                M0,80C240,20 480,140 720,100C960,60 1200,20 1440,64V120H0V80Z;
                M0,64C240,140 480,20 720,60C960,100 1200,140 1440,80V120H0V64Z"/>
    </path>
  </svg>
</div>
  </section>

  <!-- BLOQUE 1 — HISTORIA -->
  <section class="section section-story" id="story">
    <div class="section-inner" id="storyInner"></div>
  </section>

  <!-- BLOQUE 2 — SERVICIOS -->
  <section class="section section-services" id="services">
    <div class="section-inner" id="servicesInner"></div>
  </section>

  <!-- BLOQUE 3 — GALERÍA -->
  <section class="section section-gallery" id="gallery">
    <div class="section-inner" id="galleryInner"></div>
  </section>

  <!-- BLOQUE 4: FILOSOFÍA -->
<section id="philosophy" class="section section-philosophy">
  <div class="section-inner" id="philosophyInner"></div>
</section>

<!-- BLOQUE 5: E-COMMERCE (NUEVO) -->
<section id="ecommerce" class="section section-ecommerce">
  <div class="section-inner" id="ecommerceInner"></div>
</section>

  <!-- FOOTER -->
  <footer class="footer" id="footer">
    <div class="footer-inner" id="footerInner"></div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
