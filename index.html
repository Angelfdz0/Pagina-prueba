<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | Estudio Creativo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ★ CURSOR PERSONALIZADO ★ -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursorFollower"></div>

    <!-- ★ GRAIN OVERLAY ★ -->
    <div class="grain-overlay"></div>

    <!-- ★ LOADER ★ -->
    <div class="loader" id="loader">
        <div class="loader-inner">
            <div class="loader-title-wrapper">
                <span class="loader-title-base">STUDIO</span>
                <span class="loader-title-fill" id="loaderTitleFill">STUDIO</span>
            </div>
            <div class="loader-percentage" id="loaderPercentage">0%</div>
        </div>
    </div>

    <!-- ★ HEADER ★ -->
    <header class="header" id="header">
        <nav class="nav" id="nav"></nav>
    </header>

    <!-- ★ HERO ★ -->
    <section class="hero" id="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-glow"></div>
        <div class="hero-content" id="heroContent"></div>
        <div class="scroll-indicator" id="scrollIndicator">
            <div class="scroll-indicator-line"></div>
            <span class="scroll-indicator-text">Scroll</span>
        </div>
        <div class="hero-wave">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="var(--color-bg)"/>
            </svg>
        </div>
    </section>

    <!-- ★ BLOQUE 1: HISTORIA ★ -->
    <section class="section section-story" id="story">
        <div class="section-inner" id="storyInner"></div>
    </section>

    <!-- ★ BLOQUE 2: SERVICIOS ★ -->
    <section class="section section-services" id="services">
        <div class="section-inner" id="servicesInner"></div>
    </section>

    <!-- ★ BLOQUE 3: GALERÍA ★ -->
    <section class="section section-gallery" id="gallery">
        <div class="section-inner" id="galleryInner"></div>
    </section>

    <!-- ★ BLOQUE 4: FILOSOFÍA ★ -->
    <section class="section section-philosophy" id="philosophy">
        <div class="section-inner" id="philosophyInner"></div>
    </section>

    <!-- ★ BLOQUE 5: E-COMMERCE ★ -->
    <section class="section section-ecommerce" id="ecommerce">
        <div class="section-inner" id="ecommerceInner"></div>
    </section>

    <!-- ★ BLOQUE 6: BLOG ★ -->
    <section class="section section-blog" id="blog">
        <div class="section-inner" id="blogInner"></div>
    </section>

    <!-- ★ BLOQUE 7: CONTACTO ★ -->
    <section class="section section-contact" id="contact">
        <div class="section-inner" id="contactInner"></div>
    </section>

    <!-- ★ FOOTER ★ -->
    <footer class="footer" id="footer">
        <div class="footer-inner" id="footerInner"></div>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
