<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estudio creativo especializado en diseño digital, branding y desarrollo web de alto impacto en México.">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Studio | Estudio Creativo">
    <meta property="og:description" content="Diseño, estrategia y tecnología fusionados para construir marcas que trascienden lo ordinario.">
    <meta property="og:locale" content="es_MX">

    <title>Studio | Estudio Creativo</title>

    <!-- Favicon SVG inline -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='55' font-weight='bold' fill='%23c9a96e' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

    <!-- Supabase CDN (necesario para el login discreto del footer) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cursor personalizado -->
    <div class="cursor" id="cursor" aria-hidden="true"></div>
    <div class="cursor-follower" id="cursorFollower" aria-hidden="true"></div>

    <!-- Grain overlay -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Loader -->
    <div class="loader" id="loader" role="status" aria-label="Cargando página">
        <div class="loader-inner">
            <div class="loader-title-wrapper">
                <span class="loader-title-base">STUDIO</span>
                <span class="loader-title-fill" id="loaderTitleFill">STUDIO</span>
            </div>
            <div class="loader-percentage" id="loaderPercentage" aria-live="polite">0%</div>
        </div>
    </div>

    <!-- Header -->
    <header class="header" id="header" role="banner">
        <nav class="nav" id="nav" role="navigation" aria-label="Navegación principal"></nav>
    </header>

    <main role="main">
        <!-- Hero -->
        <section class="hero" id="hero" aria-label="Inicio">
            <div class="hero-bg" id="heroBg" aria-hidden="true"></div>
            <div class="hero-glow" aria-hidden="true"></div>
            <div class="hero-content" id="heroContent"></div>
            <div class="scroll-indicator" id="scrollIndicator" aria-hidden="true">
                <div class="scroll-indicator-line"></div>
                <span class="scroll-indicator-text">Scroll</span>
            </div>
            <div class="hero-wave" aria-hidden="true">
                <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                    <path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="var(--color-bg)"/>
                </svg>
            </div>
        </section>

        <!-- Bloque 1: Historia -->
        <section class="section section-story" id="story">
            <div class="section-inner" id="storyInner"></div>
        </section>

        <!-- Bloque 2: Servicios -->
        <section class="section section-services" id="services">
            <div class="section-inner" id="servicesInner"></div>
        </section>

        <!-- Bloque 3: Galería -->
        <section class="section section-gallery" id="gallery">
            <div class="section-inner" id="galleryInner"></div>
        </section>

        <!-- Bloque 4: Filosofía -->
        <section class="section section-philosophy" id="philosophy">
            <div class="section-inner" id="philosophyInner"></div>
        </section>

        <!-- Bloque 5: E-Commerce -->
        <section class="section section-ecommerce" id="ecommerce">
            <div class="section-inner" id="ecommerceInner"></div>
        </section>

        <!-- Bloque 6: Blog -->
        <section class="section section-blog" id="blog">
            <div class="section-inner" id="blogInner"></div>
        </section>

                <!-- Bloque: Testimonios -->
        <section class="section section-testimonials" id="testimonials">
            <div class="section-inner" id="testimonialsInner"></div>
        </section>

        <!-- Bloque 7: Contacto -->
        <section class="section section-contact" id="contact">
            <div class="section-inner" id="contactInner"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer" role="contentinfo">
        <div class="footer-inner" id="footerInner"></div>
    </footer>

    <!-- Scripts (orden importante) -->
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="admin-auth.js"></script>
</body>
</html>
