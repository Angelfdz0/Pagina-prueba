<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Studio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <!-- Grain Overlay -->
    <div class="grain-overlay"></div>
    
    <!-- Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    
    <!-- Header Shop -->
    <header class="shop-header" id="shopHeader">
        <div class="shop-header-inner">
            <a href="index.html" class="shop-logo">STU<span>DIO</span></a>
            
            <div class="shop-search-bar">
                <input type="text" id="searchInput" placeholder="Buscar productos..." autocomplete="off">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
            
            <div class="shop-header-actions">
                <button class="cart-toggle" id="cartToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6h15l-1.5 9h-12z"></path>
                        <circle cx="9" cy="20" r="1"></circle>
                        <circle cx="18" cy="20" r="1"></circle>
                        <path d="M6 6L5 3H2"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Tienda -->
    <section class="shop-hero">
        <div class="shop-hero-bg" id="shopHeroBg"></div>
        <div class="shop-hero-glow"></div>
        <div class="shop-hero-content">
            <span class="shop-eyebrow">Tienda Online</span>
            <h1 class="shop-title">
                <span class="line"><span class="line-inner">Productos que</span></span>
                <span class="line"><span class="line-inner"><em>inspiran</em></span></span>
            </h1>
            <p class="shop-subtitle">Descubre nuestra colección curada de productos diseñados para transformar tu espacio y estilo de vida.</p>
        </div>
        <div class="shop-hero-wave">
            <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 120L60 110C120 100 240 80 360 70C480 60 600 60 720 65C840 70 960 80 1080 85C1200 90 1320 90 1380 90L1440 90V120H1380C1320 120 1200 120 1080 120C960 120 840 120 720 120C600 120 480 120 360 120C240 120 120 120 60 120H0Z" fill="#0a0a0a"/>
            </svg>
        </div>
    </section>

    <!-- Filtros -->
    <section class="shop-filters-section">
        <div class="shop-filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="destacado">Destacados</button>
            <button class="filter-btn" data-filter="nuevo">Nuevos</button>
            <button class="filter-btn" data-filter="popular">Populares</button>
            <button class="filter-btn" data-filter="oferta">Ofertas</button>
        </div>
        <div class="shop-sort">
            <select id="sortSelect">
                <option value="default">Ordenar por</option>
                <option value="price-asc">Precio: Menor a Mayor</option>
                <option value="price-desc">Precio: Mayor a Menor</option>
                <option value="name-asc">Nombre: A-Z</option>
                <option value="name-desc">Nombre: Z-A</option>
            </select>
        </div>
    </section>

    <!-- Productos Grid -->
    <section class="shop-products-section">
        <div class="shop-products-grid" id="productsGrid">
            <!-- Los productos se cargan dinámicamente -->
        </div>
        <div class="shop-no-results" id="noResults" style="display: none;">
            <p>No se encontraron productos</p>
        </div>
    </section>

    <!-- Carrito Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-content">
            <div class="cart-header">
                <h2>Tu Carrito</h2>
                <button class="cart-close" id="cartClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Items del carrito -->
            </div>
            <div class="cart-empty" id="cartEmpty">
                <p>Tu carrito está vacío</p>
                <a href="#products" class="cart-continue">Continuar comprando</a>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0</span>
                </div>
                <button class="cart-checkout" id="cartCheckout">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Quick View Modal -->
    <div class="quick-view-modal" id="quickViewModal">
        <div class="quick-view-overlay"></div>
        <div class="quick-view-content">
            <button class="quick-view-close" id="quickViewClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
            <div class="quick-view-body" id="quickViewBody">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="shop.js"></script>
</body>
</html>
