<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Studio</title>
    <!-- Tus estilos -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
    <!-- Fuentes (ajusta si usas otras) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ★ HEADER (Lo construye shop.js) -->
    <header class="shop-header" id="shopHeader"></header>

    <!-- ★ HERO (Lo construye shop.js) -->
    <section class="shop-hero">
        <div class="shop-hero-bg"></div>
        <div class="shop-hero-glow"></div>
        <!-- Efecto de luz linterna desde arriba -->
<div class="shop-spotlight" id="shopSpotlight">
    <div class="spotlight-beam"></div>
    <div class="spotlight-glow"></div>
</div>
        <div class="shop-hero-content">
            <!-- JS inyecta aquí el eyebrow, title y subtitle -->
        </div>
        <div class="shop-hero-wave">
            <svg viewBox="0 0 1440 100" preserveAspectRatio="none">
                <path d="M0,50 C360,100 1080,0 1440,50 L1440,100 L0,100 Z"></path>
            </svg>
        </div>
    </section>

    <!-- FILTROS -->
    <section class="shop-filters-section">
        <div class="shop-filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="destacado">Destacados</button>
            <button class="filter-btn" data-filter="nuevo">Nuevos</button>
            <button class="filter-btn" data-filter="popular">Populares</button>
        </div>
        <div class="shop-sort">
            <select id="sortSelect">
                <option value="default">Ordenar por</option>
                <option value="price-asc">Precio: Menor a Mayor</option>
                <option value="price-desc">Precio: Mayor a Menor</option>
                <option value="name-asc">Nombre: A-Z</option>
            </select>
        </div>
    </section>

    <!-- PRODUCTOS -->
    <section class="shop-products-section">
        <div class="shop-products-grid" id="productsGrid"></div>
        <div class="shop-no-results" id="noResults" style="display: none;">
            No se encontraron productos
        </div>
    </section>

    <!-- CARRITO SIDEBAR -->
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-content">
            <div class="cart-header">
                <h2>Tu Carrito</h2>
                <button class="cart-close" id="cartClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="cart-items" id="cartItems">
                <div class="cart-empty" id="cartEmpty">
                    <p>Tu carrito está vacío</p>
                    <a href="#productsGrid" class="cart-continue">Continuar comprando</a>
                </div>
            </div>
            <div class="cart-footer">
                <div class="cart-promo-section">
                    <div class="cart-promo-input" id="promoInputContainer">
                        <input type="text" id="promoCodeInput" placeholder="Código de descuento">
                        <button class="cart-promo-apply" id="applyPromoBtn">Aplicar</button>
                    </div>
                    <div id="promoApplied" style="display: none; align-items: center; justify-content: space-between; background: rgba(201,169,110,0.1); padding: 0.7rem 1rem; border-radius: 4px; border: 1px solid var(--color-accent);">
                        <span style="color: var(--color-accent); font-weight: 600; font-size: 0.85rem;">Código: <span id="promoCodeDisplay"></span></span>
                        <button class="cart-remove-promo" id="removePromoBtn">Quitar</button>
                    </div>
                </div>
                <div class="cart-summary">
                    <div class="cart-summary-row">
                        <span>Subtotal:</span>
                        <span id="cartSubtotal">$0</span>
                    </div>
                    <div class="cart-summary-row cart-discount-row" id="cartDiscountRow" style="display: none;">
                        <span class="cart-discount-text">Descuento:</span>
                        <span id="cartDiscountAmount">-$0</span>
                    </div>
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cartTotal">$0</span>
                    </div>
                </div>
                <button class="cart-checkout" id="cartCheckout">Finalizar Compra</button>
            </div>
        </div>
    </aside>

    <!-- MODAL DE FICHA TÉCNICA -->
    <div class="product-modal" id="productModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
            <div class="modal-body">
                <div class="modal-gallery-section">
                    <div class="modal-gallery" id="modalGallery"></div>
                    <div class="modal-thumbnails" id="modalThumbnails"></div>
                </div>
                <div class="modal-info-section">
                    <div class="modal-info-content">
                        <span class="modal-category" id="modalCategory"></span>
                        <h2 class="modal-title" id="modalTitle"></h2>
                        <div class="modal-price" id="modalPrice"></div>
                        <p class="modal-description" id="modalDescription"></p>
                        <div class="modal-features-section">
                            <h4 class="modal-features-title">Características</h4>
                            <ul class="modal-features-list" id="modalFeatures"></ul>
                        </div>
                        <div class="modal-variants-section" id="modalVariants"></div>
                        <button class="modal-add-to-cart" id="modalAddToCart">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"></path><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
                            Agregar al Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP DE PROMOCIONES -->
    <div class="promo-popup" id="promoPopup">
        <div class="promo-popup-overlay" id="promoOverlay"></div>
        <div class="promo-popup-content">
            <button class="promo-close" id="promoClose">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
            <div class="promo-dots" id="promoDots"></div>
            <div class="promo-slider" id="promoSlider"></div>
            <button class="promo-nav promo-nav-prev" id="promoPrev">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
            </button>
            <button class="promo-nav promo-nav-next" id="promoNext">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"></path></svg>
            </button>
            <label class="promo-dont-show">
                <input type="checkbox" id="promoDontShow"> No mostrar de nuevo
            </label>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE DE WHATSAPP -->
<a href="#" class="whatsapp-float" id="whatsappFloat" aria-label="Contactar por WhatsApp" target="_blank" rel="noopener">
    <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </svg>
</a>

<!-- Cursor personalizado -->
<div class="cursor" id="cursor"></div>
<div class="cursor-follower" id="cursorFollower"></div>

    <!-- TUS SCRIPTS -->
    <script src="config.js"></script>
    <script src="app.js"></script> <!-- Si necesitas que el cursor/grain funcionen aquí también -->
    <script src="shop.js"></script>
</body>
</html>
